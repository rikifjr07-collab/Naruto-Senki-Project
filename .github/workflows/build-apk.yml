name: Build APK Naruto Senki Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Bersihkan Penyimpanan Runner (Aman)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/tgz
          
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pasang Java 8 Ramah Gradle Lama
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Pasang Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          local-cache: true
      - name: Jalankan Proses Perakitan Game
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          echo -e "ndk.dir=$ANDROID_NDK_HOME\nsdk.dir=/usr/local/lib/android/sdk" > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

          # 1. Pastikan kompiler menggunakan Clang
          find $GITHUB_WORKSPACE -name "Application.mk" -type f -exec sed -i 's/NDK_TOOLCHAIN_VERSION\s*:=\s*4.9/NDK_TOOLCHAIN_VERSION := clang/g' {} +

          # 2. BERSIHKAN FOLDER INCLUDE PUSAT
          rm -f NarutoSenki-V2-master/cocos2dx/include/toml.hpp
          rm -rf NarutoSenki-V2-master/cocos2dx/include/src
          
          mkdir -p NarutoSenki-V2-master/cocos2dx/include/src
          mkdir -p NarutoSenki-V2-master/cocos2dx/include/fmt

          # 3. SALIN KE FOLDER INCLUDE BAWAAN (LOKAL)
          cp -r NarutoSenki-V2-master/external/toml/* NarutoSenki-V2-master/cocos2dx/include/ 2>/dev/null || true
          cp -r NarutoSenki-V2-master/external/toml/* NarutoSenki-V2-master/cocos2dx/include/src/ 2>/dev/null || true
          cp -r NarutoSenki-V2-master/external/fmt/* NarutoSenki-V2-master/cocos2dx/include/fmt/ 2>/dev/null || true

          # 4. SALIN LANGSUNG KE LOKASI TARGET DI CLASSES DAN UTILS
          # Menaruh file toml.hpp langsung ke folder Classes dan subfolder Utils sesuai Gambar 1 Anda
          cp NarutoSenki-V2-master/external/toml/toml.hpp NarutoSenki-V2-master/projects/NarutoSenki/Classes/ 2>/dev/null || true
          cp NarutoSenki-V2-master/external/toml/toml.hpp NarutoSenki-V2-master/projects/NarutoSenki/Classes/Utils/ 2>/dev/null || true
          cp NarutoSenki-V2-master/external/toml/toml.hpp NarutoSenki-V2-master/projects/NarutoSenki/Classes/Core/ 2>/dev/null || true

          # 5. JALANKAN PROSES GRADLE BUILD
          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew
          
          export NDK_MODULE_PATH=$GITHUB_WORKSPACE/NarutoSenki-V2-master/external:$GITHUB_WORKSPACE/NarutoSenki-V2-master/external/toml:$GITHUB_WORKSPACE/NarutoSenki-V2-master:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android/prebuilt:$GITHUB_WORKSPACE/NarutoSenki-V2-master/CocosDenshion/android
          
          ./gradlew assembleDebug --no-daemon


      - name: Buat Menu Release Otomatis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10-build-${{ github.run_number }}
          name: Naruto Senki Build #${{ github.run_number }}
          files: |
            **/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
