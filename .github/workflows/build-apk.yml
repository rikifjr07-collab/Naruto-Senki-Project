name: Build APK Naruto Senki Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Bersihkan Penyimpanan Runner (Aman)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/tgz
          
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pasang Java 8 Ramah Gradle Lama
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Pasang Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          local-cache: true
      - name: Jalankan Proses Perakitan Game
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          echo -e "ndk.dir=$ANDROID_NDK_HOME\nsdk.dir=/usr/local/lib/android/sdk" > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

          # 1. Pastikan compiler menggunakan Clang modern
          find $GITHUB_WORKSPACE -name "Application.mk" -type f -exec sed -i 's/NDK_TOOLCHAIN_VERSION\s*:=\s*4.9/NDK_TOOLCHAIN_VERSION := clang/g' {} +

          # 2. BERSIHKAN TOTAL SEMUA PATH MANUVAL LAMA
          rm -f $GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include/toml.hpp
          rm -rf $GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include/src
          rm -rf $GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include/fmt

          # 3. SALIN FISIK DENGAN PATH ABSOLUT (MENYALIN FOLDER FMT ASLI ANDA)
          # Membuat folder pusat 'fmt' di lokasi include bawaan yang pasti dibaca compiler
          mkdir -p $GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include/fmt
          mkdir -p $GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include/src

          # Menyalin seluruh isi berkas dari folder external bawaan asli Anda
          cp -r $GITHUB_WORKSPACE/NarutoSenki-V2-master/external/toml/* $GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include/ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/NarutoSenki-V2-master/external/toml/* $GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include/src/ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/NarutoSenki-V2-master/external/fmt/* $GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include/fmt/ 2>/dev/null || true

          # 4. SALIN JUGA KE SISTEM UTAMA NDK COMPILER GLOBAL SEBAGAI JAMINAN GANDA
          mkdir -p $ANDROID_NDK_HOME/sysroot/usr/include/fmt
          mkdir -p $ANDROID_NDK_HOME/sysroot/usr/include/src
          cp -r $GITHUB_WORKSPACE/NarutoSenki-V2-master/external/toml/* $ANDROID_NDK_HOME/sysroot/usr/include/ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/NarutoSenki-V2-master/external/toml/* $ANDROID_NDK_HOME/sysroot/usr/include/src/ 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/NarutoSenki-V2-master/external/fmt/* $ANDROID_NDK_HOME/sysroot/usr/include/fmt/ 2>/dev/null || true

          # 5. JALANKAN RE-COMPILE FRESH CLEAN BUILD
          cd $GITHUB_WORKSPACE/NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew
          ./gradlew clean
          
          export NDK_MODULE_PATH=$GITHUB_WORKSPACE/NarutoSenki-V2-master/external:$GITHUB_WORKSPACE/NarutoSenki-V2-master/external/toml:$GITHUB_WORKSPACE/NarutoSenki-V2-master/external/fmt:$GITHUB_WORKSPACE/NarutoSenki-V2-master:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android/prebuilt:$GITHUB_WORKSPACE/NarutoSenki-V2-master/CocosDenshion/android
          
          ./gradlew assembleDebug --no-daemon


      - name: Buat Menu Release Otomatis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10-build-${{ github.run_number }}
          name: Naruto Senki Build #${{ github.run_number }}
          files: |
            **/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
