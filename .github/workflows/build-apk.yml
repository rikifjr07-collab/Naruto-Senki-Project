name: Build APK Naruto Senki Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Bersihkan Penyimpanan Runner (Aman)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/tgz
          
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pasang Java 8 Ramah Gradle Lama
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Pasang Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          local-cache: true
      - name: Jalankan Proses Perakitan Game
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          echo -e "ndk.dir=$ANDROID_NDK_HOME\nsdk.dir=/usr/local/lib/android/sdk" > $GITHUB_WORKSPACE/NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

          # 1. Pastikan compiler menggunakan Clang modern
          find $GITHUB_WORKSPACE -name "Application.mk" -type f -exec sed -i 's/NDK_TOOLCHAIN_VERSION\s*:=\s*4.9/NDK_TOOLCHAIN_VERSION := clang/g' {} +

          # 2. BERSIHKAN TOTAL FOLDER INCLUDE PUSAT REPO AGAR TIDAK BENTROK
          rm -rf $GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include/toml.hpp
          rm -rf $GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include/src
          rm -rf $GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include/fmt

          # 3. SOLUSI PANGKAS TOTAL: Suntikkan file penetral locale langsung ke sistem internal kompilasi NDK global
          # Ini akan membungkam error uselocale, localeconv, dan iconv_t secara permanen di level terdalam compiler
          echo -e '#ifndef _NDK_LOCALE_FIX_H_\n#define _NDK_LOCALE_FIX_H_\n#include <sys/cdefs.h>\ntypedef void* iconv_t;\ntypedef void* locale_t;\n#define LC_COLLATE_MASK 0\n#define LC_CTYPE_MASK 0\n#define LC_MONETARY_MASK 0\n#define LC_NUMERIC_MASK 0\n#define LC_TIME_MASK 0\n#define LC_MESSAGES_MASK 0\n#ifdef __cplusplus\nextern "C" {\n#endif\ninline locale_t uselocale(locale_t) { return 0; }\ninline void* localeconv() { return 0; }\n#ifdef __cplusplus\n}\n#endif\n#endif' > $GITHUB_WORKSPACE/ndk_locale_fix.h

          # Masukkan file penetral ke folder system include utama NDK
          cp $GITHUB_WORKSPACE/ndk_locale_fix.h $ANDROID_NDK_HOME/sysroot/usr/include/
          
          # Suntikkan bendera kompilasi agar file penetral ini dibaca di baris pertama proses compile
          find $GITHUB_WORKSPACE -name "Application.mk" -type f -exec sed -i "s|APP_CPPFLAGS\s*:=|APP_CPPFLAGS := -include $ANDROID_NDK_HOME/sysroot/usr/include/ndk_locale_fix.h -DFMT_STATIC_THOUSANDS_SEPARATOR=1 |g" {} +
          find $GITHUB_WORKSPACE -name "Application.mk" -type f -exec sed -i "s|APP_CPPFLAGS\s*+=|APP_CPPFLAGS += -include $ANDROID_NDK_HOME/sysroot/usr/include/ndk_locale_fix.h -DFMT_STATIC_THOUSANDS_SEPARATOR=1 |g" {} +

          # 4. Hubungkan bendera pencarian compiler (-I) langsung ke file build utama game
          find $GITHUB_WORKSPACE -name "Android.mk" -type f -exec sed -i "s|LOCAL_C_INCLUDES\s*:=|LOCAL_C_INCLUDES := $GITHUB_WORKSPACE/NarutoSenki-V2-master/external $GITHUB_WORKSPACE/NarutoSenki-V2-master/external/toml $GITHUB_WORKSPACE/NarutoSenki-V2-master/external/fmt |g" {} +
          find $GITHUB_WORKSPACE -name "Android.mk" -type f -exec sed -i "s|LOCAL_C_INCLUDES\s*+=|LOCAL_C_INCLUDES += $GITHUB_WORKSPACE/NarutoSenki-V2-master/external $GITHUB_WORKSPACE/NarutoSenki-V2-master/external/toml $GITHUB_WORKSPACE/NarutoSenki-V2-master/external/fmt |g" {} +

          # 5. MASUK KE FOLDER UTAMA DAN JALANKAN CLEAN BUILD SEGAR
          cd $GITHUB_WORKSPACE/NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew
          ./gradlew clean
          
          export NDK_MODULE_PATH=$GITHUB_WORKSPACE/NarutoSenki-V2-master/external:$GITHUB_WORKSPACE/NarutoSenki-V2-master/external/toml:$GITHUB_WORKSPACE/NarutoSenki-V2-master/external/fmt:$GITHUB_WORKSPACE/NarutoSenki-V2-master:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android/prebuilt:$GITHUB_WORKSPACE/NarutoSenki-V2-master/CocosDenshion/android
          
          ./gradlew assembleDebug --no-daemon


      - name: Buat Menu Release Otomatis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10-build-${{ github.run_number }}
          name: Naruto Senki Build #${{ github.run_number }}
          files: |
            **/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
