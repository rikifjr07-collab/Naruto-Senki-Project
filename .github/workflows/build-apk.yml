name: Build APK Naruto Senki Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Bersihkan Penyimpanan Runner (Aman)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/tgz
          
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pasang Java 8 Ramah Gradle Lama
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Pasang Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          local-cache: true

      - name: Jalankan Proses Perakitan Game
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir -p NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          echo -e "ndk.dir=$ANDROID_NDK_HOME\nsdk.dir=/usr/local/lib/android/sdk" > NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio/local.properties

          find $GITHUB_WORKSPACE -name "Application.mk" -type f -exec sed -i 's/NDK_TOOLCHAIN_VERSION\s*:=\s*4.9/NDK_TOOLCHAIN_VERSION := clang/g' {} +

          # PERBAIKAN TOTAL: Bersihkan folder include, lalu salin ulang struktur library eksternal dengan tepat
          rm -rf NarutoSenki-V2-master/cocos2dx/include/*
          mkdir -p NarutoSenki-V2-master/cocos2dx/include/src
          mkdir -p NarutoSenki-V2-master/cocos2dx/include/fmt

          # Salin isi library toml bawaan proyek asli
          cp -r NarutoSenki-V2-master/external/toml/* NarutoSenki-V2-master/cocos2dx/include/ 2>/dev/null || true
          cp -r NarutoSenki-V2-master/external/toml/* NarutoSenki-V2-master/cocos2dx/include/src/ 2>/dev/null || true
          
          # Salin isi library fmt bawaan proyek asli
          cp -r NarutoSenki-V2-master/external/fmt/* NarutoSenki-V2-master/cocos2dx/include/fmt/ 2>/dev/null || true

          # JALUR CADANGAN: Jika folder external ternyata kosong, unduh master toml.hpp & fmt langsung ke folder include
          curl -L https://githubusercontent.com -o NarutoSenki-V2-master/cocos2dx/include/toml.hpp
          curl -L https://githubusercontent.com -o NarutoSenki-V2-master/cocos2dx/include/src/toml.hpp
          curl -L https://githubusercontent.com -o NarutoSenki-V2-master/cocos2dx/include/fmt/core.h
          curl -L https://githubusercontent.com -o NarutoSenki-V2-master/cocos2dx/include/fmt/format.h
          curl -L https://githubusercontent.com -o NarutoSenki-V2-master/cocos2dx/include/fmt/format-inl.h

          cd NarutoSenki-V2-master/projects/NarutoSenki/proj.android-studio
          chmod +x gradlew
          
          # Daftarkan folder include secara eksplisit di awal NDK_MODULE_PATH
          export NDK_MODULE_PATH=$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/include:$GITHUB_WORKSPACE/NarutoSenki-V2-master:$GITHUB_WORKSPACE/NarutoSenki-V2-master/external:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android:$GITHUB_WORKSPACE/NarutoSenki-V2-master/cocos2dx/platform/third_party/android/prebuilt:$GITHUB_WORKSPACE/NarutoSenki-V2-master/CocosDenshion/android
          
          ./gradlew assembleDebug --no-daemon


      - name: Buat Menu Release Otomatis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.10-build-${{ github.run_number }}
          name: Naruto Senki Build #${{ github.run_number }}
          files: |
            **/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
